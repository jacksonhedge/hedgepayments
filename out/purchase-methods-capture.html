<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, initial-scale=1.0">
<title>Purchase Methods</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1129;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    color: white;
    width: 393px;
    min-height: 852px;
    padding: 60px 24px 40px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .close-btn {
    color: rgba(255,255,255,0.5);
    font-size: 24px;
    font-weight: 300;
    cursor: pointer;
    margin-top: 4px;
  }

  .subtitle {
    font-size: 17px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 24px;
    font-weight: 400;
  }

  .method-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .method-card:hover {
    background: rgba(255,255,255,0.08);
  }

  .icon-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-green {
    background: #22c55e;
  }

  .icon-visa {
    background: linear-gradient(135deg, #1a1f71 50%, #c4122e 50%);
  }

  .icon-green-light {
    background: #22c55e;
  }

  .icon-circle svg {
    width: 24px;
    height: 24px;
    fill: white;
  }

  .icon-circle .visa-text {
    font-size: 10px;
    font-weight: 800;
    color: white;
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .icon-circle .mastercard {
    display: flex;
    gap: -4px;
  }

  .method-label {
    font-size: 18px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
  }

  /* Online Banking icon - arrow into box */
  .banking-icon {
    position: relative;
  }
  .banking-icon svg {
    width: 26px;
    height: 26px;
  }

  /* Cash at Retail - play button style */
  .retail-icon svg {
    width: 26px;
    height: 26px;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>Purchase Methods</h1>
    <span class="close-btn">&times;</span>
  </div>
  <p class="subtitle">Add New</p>

  <!-- Online Banking -->
  <div class="method-card">
    <div class="icon-circle icon-green banking-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 6L12 3L18 6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 3V14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M8 14H16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M15 11L12 14L9 11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="method-label">Online Banking</span>
  </div>

  <!-- Debit -->
  <div class="method-card">
    <div class="icon-circle icon-visa">
      <div style="text-align: center;">
        <div class="visa-text">VISA</div>
        <div style="display: flex; justify-content: center; gap: 0; margin-top: 4px;">
          <div style="width: 12px; height: 12px; border-radius: 50%; background: #eb001b; opacity: 0.9;"></div>
          <div style="width: 12px; height: 12px; border-radius: 50%; background: #f79e1b; opacity: 0.9; margin-left: -4px;"></div>
        </div>
      </div>
    </div>
    <span class="method-label">Debit</span>
  </div>

  <!-- Cash At Retail -->
  <div class="method-card">
    <div class="icon-circle icon-green-light retail-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 5.14v14l11-7-11-7z" fill="white"/>
      </svg>
    </div>
    <span class="method-label">Cash At Retail</span>
  </div>
</body>
</html>
