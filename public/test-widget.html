<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HedgePayments Widget Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .test-section h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .status {
            padding: 10px 15px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 14px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #059669;
        }
        .widget-container {
            min-height: 400px;
            border: 2px dashed #cbd5e0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🦔</div>
        <h1>HedgePayments Widget Test</h1>
        <p class="subtitle">Testing the embedded payment widget integration</p>

        <div class="test-section">
            <h2>1. Widget Initialization</h2>
            <button onclick="initializeWidget()">Initialize Widget</button>
            <div id="init-status" class="status info">Widget not initialized</div>
        </div>

        <div class="test-section">
            <h2>2. Payment Widget</h2>
            <div id="hedge-payment-widget" class="widget-container">
                <div style="text-align: center; color: #718096;">
                    Widget will load here
                </div>
            </div>
        </div>

        <div class="test-section">
            <h2>3. Test Transaction</h2>
            <button onclick="testTransaction()">Test $10 Payment</button>
            <div id="transaction-status" class="status info">No transaction attempted</div>
        </div>

        <div class="test-section">
            <h2>4. Event Log</h2>
            <div id="event-log" style="font-family: monospace; font-size: 12px; background: #1a1a1a; color: #0f0; padding: 15px; border-radius: 5px; max-height: 200px; overflow-y: auto;">
                > Waiting for events...<br>
            </div>
        </div>
    </div>

    <!-- Load the widget script -->
    <script src="/embed/hedge-widget.js"></script>

    <script>
        let widget = null;
        const eventLog = document.getElementById('event-log');

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f00' : type === 'success' ? '#0f0' : '#0ff';
            eventLog.innerHTML += `<span style="color: ${color}">>[${timestamp}] ${message}</span><br>`;
            eventLog.scrollTop = eventLog.scrollHeight;
        }

        function initializeWidget() {
            try {
                // Initialize the widget
                widget = new HedgePayments('test_pk_12345', {
                    theme: {
                        primaryColor: '#10b981',
                        fontFamily: 'Inter, sans-serif',
                        borderRadius: '8px'
                    },
                    features: {
                        savePaymentMethod: true,
                        multiCurrency: true,
                        walletPayments: true
                    },
                    onReady: () => {
                        log('Widget initialized successfully', 'success');
                        document.getElementById('init-status').className = 'status success';
                        document.getElementById('init-status').textContent = '✅ Widget initialized';
                    },
                    onError: (error) => {
                        log(`Error: ${error.message}`, 'error');
                        document.getElementById('init-status').className = 'status error';
                        document.getElementById('init-status').textContent = '❌ Initialization failed';
                    },
                    onPaymentSuccess: (payment) => {
                        log(`Payment successful: ${JSON.stringify(payment)}`, 'success');
                    },
                    onPaymentFailed: (error) => {
                        log(`Payment failed: ${error.message}`, 'error');
                    }
                });

                // Mount the widget
                widget.mount('#hedge-payment-widget');
                log('Mounting widget to container');

            } catch (error) {
                log(`Failed to initialize: ${error.message}`, 'error');
                document.getElementById('init-status').className = 'status error';
                document.getElementById('init-status').textContent = '❌ ' + error.message;
            }
        }

        function testTransaction() {
            if (!widget) {
                log('Widget not initialized', 'error');
                document.getElementById('transaction-status').className = 'status error';
                document.getElementById('transaction-status').textContent = '❌ Initialize widget first';
                return;
            }

            log('Starting test transaction...');
            document.getElementById('transaction-status').className = 'status info';
            document.getElementById('transaction-status').textContent = '⏳ Processing...';

            // Simulate a payment
            widget.processPayment({
                amount: 1000, // $10.00 in cents
                currency: 'USD',
                description: 'Test Payment',
                metadata: {
                    test: true,
                    timestamp: Date.now()
                }
            }).then(result => {
                log(`Transaction successful: ${result.id}`, 'success');
                document.getElementById('transaction-status').className = 'status success';
                document.getElementById('transaction-status').textContent = '✅ Payment completed: ' + result.id;
            }).catch(error => {
                log(`Transaction failed: ${error.message}`, 'error');
                document.getElementById('transaction-status').className = 'status error';
                document.getElementById('transaction-status').textContent = '❌ ' + error.message;
            });
        }

        // Auto-initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            log('Page loaded, ready to initialize widget');
        });

        // Listen for widget events
        window.addEventListener('hedge:payment:start', (e) => {
            log(`Payment started: ${JSON.stringify(e.detail)}`);
        });

        window.addEventListener('hedge:payment:complete', (e) => {
            log(`Payment complete: ${JSON.stringify(e.detail)}`, 'success');
        });

        window.addEventListener('hedge:payment:error', (e) => {
            log(`Payment error: ${e.detail.message}`, 'error');
        });
    </script>
</body>
</html>
